name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal: [1.8.2, latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install GMP
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Run specs
        run: crystal spec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
      - name: Check formatting
        run: crystal tool format --check
      - name: Install dependencies
        run: shards install
      - name: Run ameba
        run: |
          mkdir -p bin
          crystal build lib/ameba/bin/ameba.cr -o bin/ameba
          bin/ameba
